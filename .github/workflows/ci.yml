name: CI

on:
  push:
    branches: [main, pruebas]
  pull_request:

jobs:
  motor:
    name: Motor y PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build de la PWA (incluye revisión de tipos)
        run: npm run build -w @checador/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - run: npm run typecheck

  base-de-datos:
    name: Migraciones y RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas con "Automatically expose new tables" activada (valor por omisión de Supabase)
        run: ./supabase/tests/run-local.sh
        env:
          EXPONER_TABLAS: 1
      - name: Pruebas con "Automatically expose new tables" desactivada (recomendado por Supabase)
        run: ./supabase/tests/run-local.sh
        env:
          EXPONER_TABLAS: 0
